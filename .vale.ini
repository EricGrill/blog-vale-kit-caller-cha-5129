# Template for a blog repo. Copy this file to the repository root.
# Then add your site next to Base (see styles/Example and templates/STYLE.md):
#
#   BasedOnStyles = Base, YourSite
#   Vocab = Base, YourSite

MinAlertLevel = suggestion
StylesPath = styles

[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Base
Vocab = Base
BlockIgnores = (?s) *(```.*?```), (?s) *(\{/\*.*?\*/\}), (?s) *(</?[A-Z][A-Za-z0-9.]*\b[^>]*>), (?m)^(?:import|export)\s.+$
TokenIgnores = (`[^`\n]*`), (</?[A-Za-z][^>\n]*>), (\{[^{}\n]*\})
